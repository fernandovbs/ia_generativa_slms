[project]
name = "ia-generativa-slms-deploy"
version = "0.1.0"
description = "Demonstração prática de Deploy de Small Language Models (SLMs): Cloud (FastAPI + ONNX + Docker), Local (GGUF + Ollama) e Mobile (MLC LLM Android)"
readme = "ia_generativa_slms_deploy.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.43.0,<5.0.0",
    "optimum[onnxruntime]>=1.21.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    " onnxscript",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.24.0",
    "accelerate>=0.30.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "gguf>=0.19.0",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
]
