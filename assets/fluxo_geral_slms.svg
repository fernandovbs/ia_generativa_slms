<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 16px; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .box-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .badge { font-family: 'Consolas', monospace; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 5,4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1120" height="490" class="bg" />
  <text x="560" y="38" text-anchor="middle" class="title">Arquitetura Geral: 1 Modelo Base → 3 Paradigmas de Deploy (Zero PyTorch em Produção)</text>
  <text x="560" y="60" text-anchor="middle" class="subtitle">Progressão de Compressão, Quantização e Especialização de Hardware do Cloud ao Edge Mobile</text>

  <!-- Base Model Box (Left) -->
  <rect x="30" y="165" width="245" height="175" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
  <rect x="52" y="153" width="200" height="24" rx="6" fill="#f59e0b" />
  <text x="152" y="169" text-anchor="middle" class="badge">MODELO BASE (HUGGING FACE)</text>
  <text x="152" y="202" text-anchor="middle" class="box-title">Qwen2.5-0.5B-Instruct</text>
  <text x="152" y="226" text-anchor="middle" class="box-text">• Arquitetura: Qwen2 (24 camadas)</text>
  <text x="152" y="246" text-anchor="middle" class="box-text">• Formato: model.safetensors</text>
  <text x="152" y="266" text-anchor="middle" class="box-text">• Precisão Original: BF16 (16-bit)</text>
  <text x="152" y="286" text-anchor="middle" class="box-text">• Tamanho Base: ~942.3 MB</text>
  <text x="152" y="314" text-anchor="middle" class="box-text" fill="#fbbf24">GQA: 14 Q-Heads / 2 KV-Heads</text>

  <!-- Arrows from Base Model to 3 Demos -->
  <path d="M 275 215 C 325 215, 325 132, 375 132" class="arrow" marker-end="url(#arrow)" />
  <path d="M 275 252 L 375 252" class="arrow" marker-end="url(#arrow)" />
  <path d="M 275 290 C 325 290, 325 390, 375 390" class="arrow" marker-end="url(#arrow)" />

  <!-- Demo 1: Cloud ONNX -->
  <rect x="385" y="80" width="705" height="105" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="405" y="68" width="220" height="22" rx="5" fill="#38bdf8" />
  <text x="515" y="83" text-anchor="middle" class="badge">DEMO 1: CLOUD / MICROSSERVIÇO</text>
  <text x="405" y="114" class="box-title">ONNX Runtime + FastAPI + Docker (CPUExecutionProvider)</text>
  <text x="405" y="138" class="box-text">• Exportação via Optimum (ORTModelForCausalLM) → Grafo .onnx + KV-Cache explícito</text>
  <text x="405" y="160" class="box-text">• Produção: Container leve (python:3.12-slim) + Loop Autoregressivo NumPy (Swagger :8000)</text>
  <rect x="935" y="102" width="138" height="62" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="1004" y="128" text-anchor="middle" class="box-title" fill="#38bdf8">FP32 (.onnx)</text>
  <text x="1004" y="149" text-anchor="middle" class="box-text">~1890.4 MB</text>

  <!-- Demo 2: Local GGUF -->
  <rect x="385" y="205" width="705" height="105" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2" />
  <rect x="405" y="193" width="220" height="22" rx="5" fill="#4ade80" />
  <text x="515" y="208" text-anchor="middle" class="badge">DEMO 2: EDGE LOCAL / NOTEBOOK</text>
  <text x="405" y="239" class="box-title">llama.cpp (GGUF) + Ollama + Open WebUI em Docker</text>
  <text x="405" y="263" class="box-text">• Conversão via convert_hf_to_gguf.py (--outtype q8_0) → Arquivo único .gguf com mmap</text>
  <text x="405" y="285" class="box-text">• Produção: Modelfile (num_ctx 16384) + API REST (:11435) + Chat Open WebUI (:3000)</text>
  <rect x="935" y="227" width="138" height="62" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" />
  <text x="1004" y="253" text-anchor="middle" class="box-title" fill="#4ade80">Q8_0 (8-bit)</text>
  <text x="1004" y="274" text-anchor="middle" class="box-text">~506.5 MB (-73%)</text>

  <!-- Demo 3: Mobile Android MLC -->
  <rect x="385" y="330" width="705" height="125" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
  <rect x="405" y="318" width="235" height="22" rx="5" fill="#c084fc" />
  <text x="522" y="333" text-anchor="middle" class="badge">DEMO 3: MOBILE NATIVO (ANDROID)</text>
  <text x="405" y="364" class="box-title">MLC LLM (Apache TVM) + OpenCL GPU + APK Nativo Offline</text>
  <text x="405" y="388" class="box-text">• Quantização em grupo de 4 bits (q4f16_1) + Compilação TVM Relax (aarch64-linux-android)</text>
  <text x="405" y="410" class="box-text">• Memória Otimizada: context_window=4096, prefill_chunk=512 (Apenas ~628 MB de RAM total!)</text>
  <text x="405" y="432" class="box-text">• Produção: gradlew assembleDebug → qwen2.5-mlc-chat.apk + Pesos Offline via USB (adb)</text>
  <rect x="935" y="360" width="138" height="65" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
  <text x="1004" y="386" text-anchor="middle" class="box-title" fill="#c084fc">q4f16_1 (4-bit)</text>
  <text x="1004" y="408" text-anchor="middle" class="box-text">~265.1 MB (-86%)</text>
</svg>
